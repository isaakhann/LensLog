<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Shutter Gradient -->
    <linearGradient id="shutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- App Icon Rounded Square Canvas -->
  <rect x="5" y="5" width="110" height="110" rx="25" fill="url(#bgGrad)" />

  <!-- Lens Outer Rings -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="#334155" stroke-width="4" />
  <circle cx="60" cy="60" r="34" fill="none" stroke="#475569" stroke-width="1.5" />

  <!-- Interlocking Geometric Shutter Blades -->
  <g stroke="url(#shutterGrad)" stroke-width="3.5" stroke-linecap="round">
    <line x1="51.34" y1="45" x2="96" y2="45" />
    <line x1="51.34" y1="45" x2="96" y2="45" transform="rotate(60 60 60)" />
    <line x1="51.34" y1="45" x2="96" y2="45" transform="rotate(120 60 60)" />
    <line x1="51.34" y1="45" x2="96" y2="45" transform="rotate(180 60 60)" />
    <line x1="51.34" y1="45" x2="96" y2="45" transform="rotate(240 60 60)" />
    <line x1="51.34" y1="45" x2="96" y2="45" transform="rotate(300 60 60)" />
  </g>

  <!-- Glowing Lens Core -->
  <circle cx="60" cy="60" r="10" fill="#38bdf8" opacity="0.15" />
  <circle cx="60" cy="60" r="4" fill="#38bdf8" />

  <!-- Glass Reflection Highlight -->
  <path d="M 32 60 A 28 28 0 0 1 60 32" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />
</svg>
